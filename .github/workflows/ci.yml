name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dripsign
          POSTGRES_PASSWORD: dripsign
          POSTGRES_DB: dripsign
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dripsign -d dripsign"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The packageManager field pins pnpm; corepack installs exactly that version.
      - run: corepack enable pnpm && corepack install
      - run: pnpm install --frozen-lockfile
      - run: tools/ci static
      - run: tools/ci types
      - run: pnpm exec vitest run
      - run: tools/ci build
